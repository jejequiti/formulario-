<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f0e8">
	<title>Transportadora Pimentel | Gestor de Frota</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<p>TRANSPORTADORA PIMENTEL · GESTOR DE FROTA</p>
	</header>

	<main id="inicio">
		<section class="form-panel" aria-labelledby="form-title">
			<div class="form-heading">
				<h1 id="form-title">Candidatura a Gestor de Frota</h1>
				<p>Preencha seus dados para se candidatar à equipe da Transportadora Pimentel.</p>
			</div>

			<form action="#confirmacao" method="get">
				<div class="form-grid">
					<div class="field field-wide">
						<label for="nome">Nome completo <span aria-hidden="true">*</span></label>
						<input id="nome" name="nome" type="text" autocomplete="name" required aria-required="true">
					</div>

					<div class="field">
						<label for="email">E-mail <span aria-hidden="true">*</span></label>
						<input id="email" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" required aria-required="true" aria-describedby="email-error">
						<span class="field-error" id="email-error" role="alert">Confira o formato do e-mail, por exemplo: nome@exemplo.com.</span>
					</div>

					<div class="field">
						<label for="telefone">Celular</label>
						<input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel">
					</div>

					<div class="field">
						<label for="data">Data de nascimento</label>
						<input id="data" name="data" type="date" autocomplete="bday">
					</div>

					<div class="field">
						<label for="experiencia">Experiência com gestão de frota</label>
						<select id="experiencia" name="experiencia">
							<option value="">Selecione uma opção</option>
							<option value="ate-1-ano">Menos de 1 ano</option>
							<option value="1-a-3-anos">De 1 a 3 anos</option>
							<option value="mais-de-3-anos">Mais de 3 anos</option>
						</select>
					</div>

					<fieldset class="field field-wide session-options">
						<legend>Melhor horário para contato <span aria-hidden="true">*</span></legend>
						<div class="radio-list">
							<label class="radio-option" for="horario-manha">
								<input id="horario-manha" name="horario" type="radio" value="manha" required aria-required="true">
								<span><strong>Manhã</strong><small>9h às 12h</small></span>
							</label>
							<label class="radio-option" for="horario-tarde">
								<input id="horario-tarde" name="horario" type="radio" value="tarde">
								<span><strong>Tarde</strong><small>14h às 17h</small></span>
							</label>
						</div>
					</fieldset>

					<div class="field field-wide">
						<label for="observacoes">Algo que gostaria de contar? <span class="optional">Opcional</span></label>
						<textarea id="observacoes" name="observacoes" rows="3"></textarea>
					</div>

					<div class="field-wide consent-field">
						<input id="confirmacao" name="confirmacao" type="checkbox" value="sim" required aria-required="true">
						<label for="confirmacao">Autorizo o contato sobre esta candidatura.</label>
					</div>
				</div>

				<button class="submit-button" type="submit">Enviar candidatura <span aria-hidden="true">↗</span></button>
				<p class="form-footnote"><span aria-hidden="true">*</span> Campos obrigatórios.</p>
			</form>
		</section>
	</main>

	<footer class="site-footer">
		<p>Transportadora Pimentel</p>
	</footer>
</body>
</html>
